name: Build Passify APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate APK from HTML Web Assets
        uses: kimhuilim/html-to-apk-action@v1
        with:
          build-folder-path: '.'
          app-name: 'passify'
          output-folder-path: 'apk'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: passify-android-apk
          path: apk/**/*.apk
